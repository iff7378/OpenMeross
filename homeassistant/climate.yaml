# Home Assistant MQTT config for the Meross MTS300MA running OpenBeken.
# ALTERNATIVE to the retained-discovery approach (see setup_ha.py /
# mqtt_discovery_climate.md). Use EITHER discovery OR this YAML, not both.
#
# This unit is configured HEAT-ONLY (barn condensing furnace, no AC):
# device system config is coolLvNum=0, heatLvNum=1, fanLvNum=1. So the
# climate is single-setpoint, modes [off, heat].
#
# OBK publishes channel state on   rtl87x0CAE273F5A/<ch>/get  (requires Flag 19)
# and accepts commands on          rtl87x0CAE273F5A/<ch>/set
# Channel map (autoexec on device): 1 mode(0=off,1=heat) | 3 heatTemp Fx10 |
#   7 currentTemp Fx10 | 8 currentHumi %x10 | 12 heatState | 16/17 calib
#
# Put under your MQTT config so it ends up at mqtt: -> climate:/sensor:

mqtt:
  climate:
    - name: "Shop Thermostat"
      unique_id: mts300ma_shop_thermostat
      device:
        identifiers: ["ShopThermostat"]      # merges with OBK's device + sensors
      temperature_unit: "F"
      min_temp: 45
      max_temp: 95
      temp_step: 1
      modes: ["off", "heat"]
      mode_state_topic: "rtl87x0CAE273F5A/1/get"
      mode_state_template: "{{ 'heat' if value|int >= 1 else 'off' }}"
      mode_command_topic: "rtl87x0CAE273F5A/1/set"
      mode_command_template: "{{ {'off':0,'heat':1}[value] }}"
      current_temperature_topic: "rtl87x0CAE273F5A/7/get"
      current_temperature_template: "{{ value | float / 10 }}"
      current_humidity_topic: "rtl87x0CAE273F5A/8/get"
      current_humidity_template: "{{ value | float / 10 }}"
      temperature_state_topic: "rtl87x0CAE273F5A/3/get"
      temperature_state_template: "{{ value | float / 10 }}"
      temperature_command_topic: "rtl87x0CAE273F5A/3/set"
      temperature_command_template: "{{ (value | float * 10) | int }}"
      action_topic: "rtl87x0CAE273F5A/12/get"
      action_template: "{{ 'heating' if value|int == 1 else 'idle' }}"

  sensor:
    - name: "Shop Temperature"
      unique_id: shoptherm_curtemp
      device: {identifiers: ["ShopThermostat"]}
      state_topic: "rtl87x0CAE273F5A/7/get"
      value_template: "{{ value | float / 10 }}"
      unit_of_measurement: "°F"
      device_class: temperature
      state_class: measurement
    - name: "Shop Humidity"
      unique_id: shoptherm_humidity
      device: {identifiers: ["ShopThermostat"]}
      state_topic: "rtl87x0CAE273F5A/8/get"
      value_template: "{{ value | float / 10 }}"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
    - name: "Shop Heat Setpoint"
      unique_id: shoptherm_setpoint
      device: {identifiers: ["ShopThermostat"]}
      state_topic: "rtl87x0CAE273F5A/3/get"
      value_template: "{{ value | float / 10 }}"
      unit_of_measurement: "°F"
      device_class: temperature
      state_class: measurement
